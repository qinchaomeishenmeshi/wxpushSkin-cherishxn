<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <style>
        :root {
            --bg-color: #f4f4f9; /* 浅灰色 */
            --card-bg: #ffffff;
            --text-main: #333333; /* 深灰 */
            --text-sub: #777777; /* 灰色 */
            --accent-blue: #4A90E2; /* 蓝色 */
            --border-color: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "Arial", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            position: relative;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        /* 顶部装饰条 */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--accent-blue) 0%, #7ec8f6 100%);
            border-radius: 12px 12px 0 0;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #333;
            position: relative;
        }

        .title::after {
            content: 'Message';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            color: var(--accent-blue);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .info-card {
            margin-bottom: 25px;
        }

        .info-label {
            font-size: 1rem;
            color: var(--accent-blue);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .info-content {
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 8px;
            padding: 20px;
            font-size: 1.1rem;
            color: var(--text-main);
            line-height: 1.75;
            word-break: break-word;
            white-space: pre-line;
        }

        #date {
            background: transparent;
            border: none;
            padding: 0;
            font-size: 1rem;
            color: var(--text-sub);
            font-family: 'Georgia', serif;
            font-style: italic;
        }

        /* Markdown 样式覆盖 - 清新风格 */
        .info-content h1, .info-content h2, .info-content h3 {
            color: #444;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            font-weight: 500;
            border-bottom: 1px dashed var(--accent-blue);
            padding-bottom: 5px;
        }

        .info-content strong {
            color: #d94c4c;
            font-weight: 600;
            background: rgba(216, 76, 76, 0.1);
            padding: 0 2px;
        }

        .info-content em {
            color: var(--accent-blue);
        }

        .info-content code {
            background: #f4f4f4;
            color: #d67a7a;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
            font-size: 0.9em;
        }

        .info-content pre {
            background: #f7f7f7;
            color: #666;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 1em;
            border-left: 3px solid var(--accent-blue);
        }

        .info-content blockquote {
            border-left: 3px solid var(--accent-blue);
            background-color: #f7f7f7;
            margin: 1em 0;
            padding: 10px 15px;
            color: #555;
        }

        .info-content ul, .info-content ol {
            padding-left: 20px;
            margin-bottom: 1em;
        }

        .info-content li {
            margin-bottom: 0.3em;
        }

        .info-content a {
            color: var(--accent-blue);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-blue);
        }

        .info-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
        }

        .info-content th {
            background-color: rgba(74, 144, 226, 0.1);
            color: #555;
            padding: 8px;
            font-weight: 600;
        }

        .info-content td {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 30px 25px;
            }
            .title {
                font-size: 1.7rem;
            }
            .info-content {
                padding: 15px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title" id="title">消息推送</div>

        <div class="info-card">
            <div class="info-label">通知内容</div>
            <div class="info-content" id="message">无告警信息</div>
        </div>

        <div class="info-card" style="margin-bottom: 0;">
            <div class="info-label">时间</div>
            <div class="info-content" id="date">无时间信息</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script>
        // 从 URL 参数读取数据
        function getUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return {
                title: urlParams.get('title') || '消息推送',
                message: urlParams.get('message') || '无告警信息',
                date: urlParams.get('date') || '无时间信息'
            };
        }

        // 填充页面内容
        function fillContent() {
            const params = getUrlParams();
            document.getElementById('title').textContent = params.title;
            document.getElementById('message').textContent = params.message;
            document.getElementById('date').textContent = params.date;
        }

        window.onload = function() {
            fillContent();
        };
    </script>
</body>
</html>
